<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Interaction Engine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #12121f;
            color: #ffffff;
            font-family: "Courier New", Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease;
        }

        #menu-screen {
            border: 4px solid #ffffff;
            background-color: #000000;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            width: 380px;
            max-width: calc(100vw - 30px);
            transition:
                border-color 0.5s ease,
                box-shadow 0.5s ease;
        }

        #menu-title {
            transition: color 0.5s ease;
        }

        .toggle-btn {
            background-color: #1c1c2e;
            color: #aaaaaa;
            border: 2px solid #555555;
            padding: 10px 15px;
            margin: 5px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            width: 85%;
            transition: 0.2s;
        }

        .toggle-btn:hover {
            background-color: #292942;
            color: #ffffff;
        }

        .toggle-btn.active {
            background-color: #00ffcc;
            color: #000000;
            border-color: #ffffff;
            font-weight: bold;
            transform: scale(1.05);
        }

        #route-genocide.active {
            background-color: #ff0000;
            color: #ffffff;
            border-color: #ffffff;
        }

        #start-btn {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            border: 2px solid #ffffff;
            font-size: 18px;
            padding: 12px;
            width: 85%;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 5px;
            font-family: "Courier New", Courier, monospace;
            transition: 0.2s;
        }

        #start-btn:hover {
            background-color: #00ffcc;
            border-color: #00ffcc;
        }

        #battle-arena {
            position: relative;
            width: 500px;
            height: 400px;
            max-width: calc(100vw - 20px);
            border: 4px solid #ffffff;
            background-color: #161623;
            border-radius: 10px;
            display: none;
            overflow: hidden;
            transform-origin: center center;
            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                transform 0.15s ease;
        }

        #boss-hp-bar {
            width: 500px;
            max-width: calc(100vw - 20px);
            height: 20px;
            background-color: #550000;
            border: 2px solid #ffffff;
            margin-bottom: 10px;
            display: none;
            position: relative;
        }

        #boss-hp-fill {
            width: 100%;
            height: 100%;
            background-color: #ff0000;
            transition: width 0.1s ease;
        }

        #ghost-boss {
            position: absolute;
            top: 20px;
            left: 220px;
            font-size: 60px;
            width: 60px;
            height: 60px;
            line-height: 60px;
            text-align: center;
            cursor: pointer;
            z-index: 5;
            transition:
                transform 0.05s ease,
                left 0.15s ease,
                top 0.15s ease;
        }

        #ghost-boss:hover {
            filter: brightness(1.4);
        }

        #player-soul {
            position: absolute;
            bottom: 50px;
            left: 240px;
            font-size: 20px;
            width: 20px;
            height: 20px;
            line-height: 20px;
            pointer-events: none;
            z-index: 10;
        }

        .bullet {
            position: absolute;
            background-color: #ffffff;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow:
                0 0 6px #ffffff,
                0 0 12px #aaffff;
            pointer-events: none;
            z-index: 4;
        }

        #ui-box {
            margin-top: 15px;
            width: 508px;
            max-width: calc(100vw - 20px);
            display: none;
        }

        #dialogue {
            border: 4px solid #ffffff;
            padding: 15px;
            min-height: 60px;
            background-color: #000000;
            font-size: 16px;
            color: #ffffff;
            line-height: 1.4;
            border-radius: 5px;
        }

        #action-menu {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .menu-btn {
            background-color: #000000;
            color: #ff8000;
            border: 3px solid #ff8000;
            padding: 10px 30px;
            font-size: 18px;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            width: 45%;
            transition: 0.2s;
        }

        .menu-btn:hover {
            color: #ffff00;
            border-color: #ffff00;
            background-color: #221100;
        }

        .menu-btn:active {
            transform: scale(0.96);
        }

        #player-stats {
            display: none;
            justify-content: space-between;
            width: 500px;
            max-width: calc(100vw - 20px);
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .slice-effect {
            position: absolute;
            width: 6px;
            height: 20px;
            background-color: #ff0055;
            box-shadow: 0 0 15px #ff0000;
            animation: slash 0.15s linear forwards;
            pointer-events: none;
            z-index: 20;
        }

        .heart-pop {
            position: absolute;
            font-size: 24px;
            animation: floatUp 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 30;
        }

        .damage-number {
            position: absolute;
            color: #ff4444;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            z-index: 30;
            animation: damageFloat 0.7s ease-out forwards;
        }

        .flash {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            animation: flash 0.12s ease-out forwards;
        }

        @keyframes slash {
            0% {
                transform: scaleY(0) rotate(-45deg);
                opacity: 1;
            }

            100% {
                transform: scaleY(20) rotate(-45deg);
                opacity: 0;
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-70px) scale(1.8);
                opacity: 0;
            }
        }

        @keyframes damageFloat {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-45px);
                opacity: 0;
            }
        }

        @keyframes flash {
            0% {
                background-color: rgba(255, 0, 0, 0.45);
            }

            100% {
                background-color: rgba(255, 0, 0, 0);
            }
        }

        @media (max-width: 540px) {
            #battle-arena {
                height: min(400px, calc(100vh - 250px));
                min-height: 280px;
            }

            #player-stats {
                font-size: 14px;
            }

            #dialogue {
                font-size: 13px;
            }

            .menu-btn {
                font-size: 15px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= MENU ================= -->

    <div id="menu-screen">
        <h2
            id="menu-title"
            style="color: #ffffff; margin-top: 0; letter-spacing: 2px;"
        >
            GHOST REPOSITORY
        </h2>

        <p style="margin: 10px 0 5px 0; color: #888; font-size: 13px;">
            CORE PROTOCOL:
        </p>

        <button
            id="route-pacifist"
            class="toggle-btn active"
            onclick="setRoute('pacifist')"
        >
            [ PACIFIST PATH ]
        </button>

        <button
            id="route-genocide"
            class="toggle-btn"
            onclick="setRoute('genocide')"
        >
            [ HARDCORE GENOCIDE ]
        </button>

        <p style="margin: 15px 0 5px 0; color: #888; font-size: 13px;">
            CHAMBER MODIFIER:
        </p>

        <button
            id="mod-relaxed"
            class="toggle-btn active"
            onclick="setModifier('relaxed')"
        >
            [ RELAXED CHAMBER ]
        </button>

        <button
            id="mod-timer"
            class="toggle-btn"
            onclick="setModifier('timer')"
        >
            [ 30s COUNTDOWN ]
        </button>

        <button
            id="mod-mirror"
            class="toggle-btn"
            onclick="setModifier('mirror')"
        >
            [ KINETIC MIRROR ]
        </button>

        <p
            style="
                color: #666666;
                font-size: 11px;
                margin-top: 15px;
                font-style: italic;
            "
        >
            credits to fucking max for the fucking idea of the battle i fucking
            guess
        </p>

        <button id="start-btn" onclick="launchGame()">
            INITIALISE MATRIX
        </button>
    </div>

    <!-- ================= HUD ================= -->

    <div id="boss-hp-bar">
        <div id="boss-hp-fill"></div>
    </div>

    <div id="player-stats">
        <div id="stat-name" style="color: #ffffff;">
            PLAYER LV 1
        </div>

        <div id="stat-hp-box" style="color: #ff4d6d;">
            HP:
            <span id="player-hp">99</span>
            /
            <span id="player-max-hp">99</span>
        </div>
    </div>

    <!-- ================= ARENA ================= -->

    <div id="battle-arena">

        <div
            id="ghost-boss"
            style="left: 220px; top: 170px;"
        >
            👻
        </div>

        <div
            id="player-soul"
            style="display: none;"
        >
            ❤️
        </div>

    </div>

    <!-- ================= DIALOGUE ================= -->

    <div id="ui-box">

        <div id="dialogue">
            Calibrating personality matrices...
        </div>

        <div id="action-menu" style="display: none;">

            <button
                class="menu-btn"
                onclick="executePlayerAttack()"
            >
                [ FIGHT ]
            </button>

            <button
                class="menu-btn"
                onclick="attemptMercy()"
            >
                [ MERCY ]
            </button>

        </div>
    </div>

    <script>
        "use strict";

        // ============================================================
        // DOM REFERENCES
        // ============================================================

        const arena = document.getElementById("battle-arena");
        const soul = document.getElementById("player-soul");
        const boss = document.getElementById("ghost-boss");

        const dialogue = document.getElementById("dialogue");
        const bossHpFill = document.getElementById("boss-hp-fill");

        const playerHpDisplay = document.getElementById("player-hp");
        const playerMaxHpDisplay = document.getElementById("player-max-hp");

        const menuScreen = document.getElementById("menu-screen");
        const menuTitle = document.getElementById("menu-title");
        const menuText = document.getElementById("menu-text");

        const startBtn = document.getElementById("start-btn");
        const actionMenu = document.getElementById("action-menu");
        const playerStats = document.getElementById("player-stats");
        const bossHpBar = document.getElementById("boss-hp-bar");

        // ============================================================
        // GAME STATE
        // ============================================================

        let chosenRoute = "pacifist";
        let chosenModifier = "relaxed";

        let timeLeft = 30;
        let countdownInterval = null;

        const MAX_BOSS_HP = 600;
        const MAX_PLAYER_HP = 99;

        let bossHp = MAX_BOSS_HP;
        let playerHp = MAX_PLAYER_HP;

        let isBattleActive = false;

        let attackCycle = null;
        let mirrorCycle = null;
        let pacifistMoveCycle = null;

        let bullets = [];

        let soulX = 240;
        let soulY = 320;

        let pacifistClicks = 0;
        let karmaPoints = 0;
        let lastClickTime = 0;

        let gameEnding = false;

        // ============================================================
        // ROUTE / MODIFIER SELECTION
        // ============================================================

        function setModifier(mod) {
            chosenModifier = mod;

            document
                .getElementById("mod-relaxed")
                .classList.remove("active");

            document
                .getElementById("mod-timer")
                .classList.remove("active");

            document
                .getElementById("mod-mirror")
                .classList.remove("active");

            document
                .getElementById("mod-" + mod)
                .classList.add("active");
        }

        function setRoute(route) {
            chosenRoute = route;

            document
                .getElementById("route-pacifist")
                .classList.remove("active");

            document
                .getElementById("route-genocide")
                .classList.remove("active");

            document
                .getElementById("route-" + route)
                .classList.add("active");

            if (route === "genocide") {
                menuScreen.style.borderColor = "#ff0000";
                menuTitle.style.color = "#ff0000";
            } else {
                menuScreen.style.borderColor = "#ffffff";
                menuTitle.style.color = "#ffffff";
            }

            menuScreen.style.boxShadow = "none";
        }

        // ============================================================
        // GAME RESET
        // ============================================================

        function resetGameState() {
            clearAllTimers();

            bullets.forEach(function (bullet) {
                if (bullet.element && bullet.element.parentNode) {
                    bullet.element.remove();
                }
            });

            bullets = [];

            bossHp = MAX_BOSS_HP;
            playerHp = MAX_PLAYER_HP;

            timeLeft = 30;

            pacifistClicks = 0;
            karmaPoints = 0;
            lastClickTime = 0;

            soulX = 240;
            soulY = 320;

            gameEnding = false;

            playerHpDisplay.innerText = MAX_PLAYER_HP;
            playerMaxHpDisplay.innerText = MAX_PLAYER_HP;

            bossHpFill.style.width = "100%";

            arena.style.transform = "rotate(0deg) scale(1)";

            boss.style.left = "220px";
            boss.style.top = "170px";
            boss.style.transform = "translateX(0)";

            soul.style.left = "240px";
            soul.style.top = "320px";

            document.body.style.backgroundColor = "#12121f";

            menuTitle.innerText = "GHOST REPOSITORY";

            if (chosenRoute === "genocide") {
                menuTitle.style.color = "#ff0000";
                menuScreen.style.borderColor = "#ff0000";
            } else {
                menuTitle.style.color = "#ffffff";
                menuScreen.style.borderColor = "#ffffff";
            }

            menuScreen.style.boxShadow = "none";

            startBtn.innerText = "INITIALISE MATRIX";
        }

        function clearAllTimers() {
            if (countdownInterval !== null) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }

            if (attackCycle !== null) {
                clearInterval(attackCycle);
                attackCycle = null;
            }

            if (mirrorCycle !== null) {
                clearInterval(mirrorCycle);
                mirrorCycle = null;
            }

            if (pacifistMoveCycle !== null) {
                clearInterval(pacifistMoveCycle);
                pacifistMoveCycle = null;
            }
        }

        // ============================================================
        // LAUNCH
        // ============================================================

        function launchGame() {
            resetGameState();

            menuScreen.style.display = "none";

            arena.style.display = "block";
            playerStats.style.display = "flex";
            document.getElementById("ui-box").style.display = "block";

            isBattleActive = true;

            if (chosenModifier === "timer") {
                startGlobalTimer();
            }

            if (chosenModifier === "mirror") {
                startMirrorModifier();
            }

            if (chosenRoute === "genocide") {
                setupGenocideFight();
            } else {
                setupPacifistChamber();
            }
        }

        // ============================================================
        // GLOBAL TIMER
        // ============================================================

        function startGlobalTimer() {
            clearInterval(countdownInterval);

            timeLeft = 30;

            updateTimerDialogue();

            countdownInterval = setInterval(function () {
                if (!isBattleActive) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    return;
                }

                timeLeft--;

                updateTimerDialogue();

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;

                    if (chosenRoute === "pacifist") {
                        endGameSequence(true);
                    } else {
                        endGameSequence(false);
                    }
                }
            }, 1000);
        }

        function updateTimerDialogue() {
            if (chosenModifier === "timer" && isBattleActive) {
                dialogue.innerText =
                    "* Time Remaining: " + Math.max(0, timeLeft) + "s";
            }
        }

        // ============================================================
        // GENOCIDE ENGINE
        // ============================================================

        function setupGenocideFight() {
            document.body.style.backgroundColor = "#000000";

            arena.style.backgroundColor = "#000000";
            arena.style.borderColor = "#ffffff";

            bossHpBar.style.display = "block";

            document.getElementById("stat-name").innerText =
                "PLAYER LV 19";

            playerHp = MAX_PLAYER_HP;
            playerHpDisplay.innerText = playerHp;

            bossHp = MAX_BOSS_HP;
            bossHpFill.style.width = "100%";

            boss.style.left = "220px";
            boss.style.top = "20px";
            boss.style.transform = "translateX(0)";

            soul.style.display = "block";
            soul.style.left = soulX + "px";
            soul.style.top = soulY + "px";

            actionMenu.style.display = "flex";

            dialogue.innerText =
                "* The anomaly blocks the exit path.";

            spawnBulletHell();
        }

        function spawnBulletHell() {
            if (attackCycle !== null) {
                clearInterval(attackCycle);
            }

            attackCycle = setInterval(function () {
                if (!isBattleActive || chosenRoute !== "genocide") {
                    return;
                }

                // Make the ghost move slightly.
                const ghostOffset =
                    Math.floor(Math.random() * 80) - 40;

                boss.style.transform =
                    "translateX(" + ghostOffset + "px)";

                const b = document.createElement("div");

                b.classList.add("bullet");

                const bossLeft =
                    parseFloat(boss.style.left) || 220;

                const bossTop =
                    parseFloat(boss.style.top) || 20;

                const startX = bossLeft + 25;
                const startY = bossTop + 50;

                b.style.left = startX + "px";
                b.style.top = startY + "px";

                arena.appendChild(b);

                const diffX = soulX - startX;
                const diffY = soulY - startY;

                const distance =
                    Math.sqrt(
                        diffX * diffX +
                        diffY * diffY
                    ) || 1;

                // Mirror modifier makes projectiles slightly faster.
                const speedMagnitude =
                    chosenModifier === "mirror"
                        ? 5.5
                        : 4.5;

                const velX =
                    (diffX / distance) *
                    speedMagnitude;

                const velY =
                    (diffY / distance) *
                    speedMagnitude;

                bullets.push({
                    element: b,
                    x: startX,
                    y: startY,
                    vx: velX,
                    vy: velY
                });
            }, 90);

            requestAnimationFrame(updateProjectiles);
        }

        function updateProjectiles() {
            if (!isBattleActive || chosenRoute !== "genocide") {
                return;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];

                b.x += b.vx;
                b.y += b.vy;

                b.element.style.left = b.x + "px";
                b.element.style.top = b.y + "px";

                if (
                    b.y > arena.clientHeight + 20 ||
                    b.y < -20 ||
                    b.x > arena.clientWidth + 20 ||
                    b.x < -20
                ) {
                    removeBullet(i);
                    continue;
                }

                // Collision box around the soul.
                if (
                    Math.abs(
                        b.x - (soulX + 10)
                    ) < 14 &&
                    Math.abs(
                        b.y - (soulY + 10)
                    ) < 14
                ) {
                    triggerPlayerDamage();
                    removeBullet(i);
                }
            }

            if (isBattleActive) {
                requestAnimationFrame(updateProjectiles);
            }
        }

        function removeBullet(index) {
            const bullet = bullets[index];

            if (
                bullet &&
                bullet.element &&
                bullet.element.parentNode
            ) {
                bullet.element.remove();
            }

            bullets.splice(index, 1);
        }

        // ============================================================
        // PLAYER DAMAGE
        // ============================================================

        function triggerPlayerDamage() {
            if (!isBattleActive) {
                return;
            }

            playerHp -= 12;

            if (playerHp < 0) {
                playerHp = 0;
            }

            playerHpDisplay.innerText = playerHp;

            flashDamage();

            if (playerHp <= 0) {
                endGameSequence(false);
            }
        }

        function flashDamage() {
            document.body.style.backgroundColor = "#4a0000";

            const flash = document.createElement("div");
            flash.className = "flash";

            arena.appendChild(flash);

            setTimeout(function () {
                if (flash.parentNode) {
                    flash.remove();
                }
            }, 130);

            setTimeout(function () {
                if (!isBattleActive) {
                    document.body.style.backgroundColor =
                        "#000000";
                } else {
                    document.body.style.backgroundColor =
                        "#000000";
                }
            }, 80);
        }

        // ============================================================
        // GENOCIDE FIGHT
        // ============================================================

        function executePlayerAttack() {
            if (
                !isBattleActive ||
                chosenRoute !== "genocide"
            ) {
                return;
            }

            const slice = document.createElement("div");

            slice.classList.add("slice-effect");

            slice.style.left = soulX + "px";
            slice.style.top = Math.max(0, soulY - 100) + "px";

            arena.appendChild(slice);

            setTimeout(function () {
                if (slice.parentNode) {
                    slice.remove();
                }
            }, 150);

            bossHp -= 50;

            if (bossHp < 0) {
                bossHp = 0;
            }

            bossHpFill.style.width =
                (bossHp / MAX_BOSS_HP) * 100 + "%";

            spawnDamageNumber(
                boss.style.left,
                boss.style.top,
                "50"
            );

            boss.style.transform =
                "translateX(0) scale(0.9)";

            setTimeout(function () {
                if (isBattleActive) {
                    boss.style.transform =
                        "translateX(0) scale(1)";
                }
            }, 80);

            if (bossHp <= 0) {
                endGameSequence(true);
            } else {
                dialogue.innerText =
                    "* Real damage logged. Anomaly HP left: " +
                    bossHp;
            }
        }

        function attemptMercy() {
            if (!isBattleActive) {
                return;
            }

            if (chosenRoute === "genocide") {
                dialogue.innerText =
                    "* Your hands remain covered in static dust. MERCY is locked out.";
            } else {
                dialogue.innerText =
                    "* You cannot attack the ghost on this route. Try interacting with it.";
            }
        }

        function spawnDamageNumber(x, y, amount) {
            const number = document.createElement("div");

            number.className = "damage-number";
            number.innerText = "-" + amount;

            number.style.left =
                parseFloat(x || 220) + 20 + "px";

            number.style.top =
                parseFloat(y || 20) + "px";

            arena.appendChild(number);

            setTimeout(function () {
                if (number.parentNode) {
                    number.remove();
                }
            }, 700);
        }

        // ============================================================
        // PACIFIST ENGINE
        // ============================================================

        function setupPacifistChamber() {
            document.body.style.backgroundColor = "#12121f";

            arena.style.backgroundColor = "#161623";
            arena.style.borderColor = "#ffffff";

            bossHpBar.style.display = "none";

            document.getElementById("stat-name").innerText =
                "PLAYER LV 1";

            playerHp = MAX_PLAYER_HP;

            playerHpDisplay.innerText = pacifistClicks;
            playerMaxHpDisplay.innerText = "20";

            soul.style.display = "none";

            actionMenu.style.display = "none";

            boss.style.left = "220px";
            boss.style.top = "170px";
            boss.style.transform = "translateX(0)";

            dialogue.innerText =
                "* A lonely ghost flickers in the chamber.";

            // Slowly move the ghost even if the player doesn't click.
            pacifistMoveCycle = setInterval(function () {
                if (!isBattleActive) {
                    return;
                }

                moveGhostRandomly();
            }, 1800);
        }

        function moveGhostRandomly() {
            if (
                !isBattleActive ||
                chosenRoute !== "pacifist"
            ) {
                return;
            }

            const maxX = arena.clientWidth - 70;
            const maxY = arena.clientHeight - 70;

            const newX =
                Math.floor(Math.random() * Math.max(1, maxX));

            const newY =
                Math.floor(Math.random() * Math.max(1, maxY));

            boss.style.left = newX + "px";
            boss.style.top = newY + "px";
        }

        boss.addEventListener("click", function (e) {
            if (
                !isBattleActive ||
                chosenRoute !== "pacifist"
            ) {
                return;
            }

            pacifistClicks++;

            // The counter represents successful interactions.
            playerHpDisplay.innerText = pacifistClicks;

            const currentTime = Date.now();

            const timeDiff =
                currentTime - lastClickTime;

            lastClickTime = currentTime;

            if (
                lastClickTime !== 0 &&
                timeDiff < 500
            ) {
                karmaPoints -= 1;

                spawnParticle(
                    e.offsetX,
                    e.offsetY,
                    "💔"
                );

                dialogue.innerText =
                    "* The ghost recoils from your frantic energy.";
            } else {
                karmaPoints += 1;

                spawnParticle(
                    e.offsetX,
                    e.offsetY,
                    "💖"
                );

                dialogue.innerText =
                    "* The ghost seems strangely comforted.";
            }

            if (pacifistClicks >= 20) {
                endGameSequence(true);
                return;
            }

            moveGhostRandomly();
        });

        // ============================================================
        // PARTICLE EFFECT
        // ============================================================

        function spawnParticle(x, y, symbol) {
            const particle = document.createElement("div");

            particle.className = "heart-pop";
            particle.innerText = symbol;

            particle.style.left = x + "px";
            particle.style.top = y + "px";

            arena.appendChild(particle);

            setTimeout(function () {
                if (particle.parentNode) {
                    particle.remove();
                }
            }, 600);
        }

        // ============================================================
        // MIRROR MODIFIER
        // ============================================================

        function startMirrorModifier() {
            clearInterval(mirrorCycle);

            mirrorCycle = setInterval(function () {
                applyMirrorDistortion();
            }, 900);
        }

        function applyMirrorDistortion() {
            if (
                chosenModifier !== "mirror" ||
                !isBattleActive
            ) {
                return;
            }

            const currentRotation =
                Math.random() * 20 - 10;

            const scale =
                1 + Math.random() * 0.05;

            arena.style.transform =
                "rotate(" +
                currentRotation +
                "deg) scale(" +
                scale +
                ")";

            // Mirror mode also periodically flips the arena.
            if (Math.random() < 0.25) {
                arena.style.transform +=
                    " scaleX(-1)";
            }

            setTimeout(function () {
                if (isBattleActive) {
                    arena.style.transform =
                        "rotate(0deg) scale(1)";
                }
            }, 150);
        }

        // ============================================================
        // MOUSE MOVEMENT
        // ============================================================

        arena.addEventListener("mousemove", function (e) {
            if (
                !isBattleActive ||
                chosenRoute !== "genocide"
            ) {
                return;
            }

            const rect =
                arena.getBoundingClientRect();

            let newX =
                e.clientX -
                rect.left -
                10;

            let newY =
                e.clientY -
                rect.top -
                10;

            newX = Math.max(
                0,
                Math.min(
                    arena.clientWidth - 20,
                    newX
                )
            );

            newY = Math.max(
                0,
                Math.min(
                    arena.clientHeight - 20,
                    newY
                )
            );

            soulX = newX;
            soulY = newY;

            soul.style.left =
                soulX + "px";

            soul.style.top =
                soulY + "px";
        });

        // ============================================================
        // TOUCH SUPPORT
        // ============================================================

        arena.addEventListener(
            "touchmove",
            function (e) {
                if (
                    !isBattleActive ||
                    chosenRoute !== "genocide"
                ) {
                    return;
                }

                e.preventDefault();

                const touch =
                    e.touches[0];

                const rect =
                    arena.getBoundingClientRect();

                let newX =
                    touch.clientX -
                    rect.left -
                    10;

                let newY =
                    touch.clientY -
                    rect.top -
                    10;

                newX = Math.max(
                    0,
                    Math.min(
                        arena.clientWidth - 20,
                        newX
                    )
                );

                newY = Math.max(
                    0,
                    Math.min(
                        arena.clientHeight - 20,
                        newY
                    )
                );

                soulX = newX;
                soulY = newY;

                soul.style.left =
                    soulX + "px";

                soul.style.top =
                    soulY + "px";
            },
            { passive: false }
        );

        // ============================================================
        // END GAME
        // ============================================================

        function endGameSequence(isVictory) {
            if (gameEnding) {
                return;
            }

            gameEnding = true;
            isBattleActive = false;

            clearAllTimers();

            bullets.forEach(function (bullet) {
                if (
                    bullet.element &&
                    bullet.element.parentNode
                ) {
                    bullet.element.remove();
                }
            });

            bullets = [];

            arena.style.transform =
                "rotate(0deg) scale(1)";

            setTimeout(function () {
                arena.style.display = "none";

                bossHpBar.style.display = "none";
                playerStats.style.display = "none";
                document.getElementById("ui-box").style.display =
                    "none";

                soul.style.display = "none";

                menuScreen.style.display = "block";

                if (chosenRoute === "genocide") {
                    handleGenocideEnding(isVictory);
                } else {
                    handlePacifistEnding(isVictory);
                }

                startBtn.innerText =
                    "RE-INITIALISE ENGINE";

                gameEnding = false;
            }, 1000);
        }

        // ============================================================
        // GENOCIDE ENDINGS
        // ============================================================

        function handleGenocideEnding(isVictory) {
            if (isVictory) {
                document.body.style.backgroundColor =
                    "#001a14";

                menuTitle.innerText =
                    "SYSTEM PURGED";

                menuTitle.style.color =
                    "#00ffcc";

                menuScreen.style.borderColor =
                    "#00ffcc";

                menuScreen.style.boxShadow =
                    "0 0 20px #00ffcc";

                setMenuDescription(
                    "The ghost dissolved into static code. You left nothing behind but dust and cold numbers."
                );
            } else {
                document.body.style.backgroundColor =
                    "#1a0000";

                menuTitle.innerText =
                    "GAME OVER";

                menuTitle.style.color =
                    "#ff0000";

                menuScreen.style.borderColor =
                    "#ff0000";

                menuScreen.style.boxShadow =
                    "0 0 20px #ff0000";

                setMenuDescription(
                    "Your determination shattered under the pressure of the localized timeline loop."
                );
            }
        }

        // ============================================================
        // PACIFIST ENDINGS
        // ============================================================

        function handlePacifistEnding(isVictory) {
            if (isVictory && karmaPoints >= 0) {
                document.body.style.backgroundColor =
                    "#1a3a2a";

                menuTitle.innerText =
                    "TRUE PACIFIST";

                menuTitle.style.color =
                    "#00ffcc";

                menuScreen.style.borderColor =
                    "#00ffcc";

                menuScreen.style.boxShadow =
                    "0 0 20px #00ffcc";

                setMenuDescription(
                    "🌸 You treated the entity with absolute patience and respect. You are bonded forever."
                );
            } else {
                document.body.style.backgroundColor =
                    "#3a0a0a";

                menuTitle.innerText =
                    "NEUTRAL CORRUPTION";

                menuTitle.style.color =
                    "#ff0000";

                menuScreen.style.borderColor =
                    "#ff0000";

                menuScreen.style.boxShadow =
                    "0 0 20px #ff0000";

                setMenuDescription(
                    "💀 Your aggressive speed and clicking tore the soul apart."
                );
            }
        }

        // ============================================================
        // MENU DESCRIPTION
        // ============================================================

        function setMenuDescription(text) {
            let description =
                document.getElementById("menu-description");

            if (!description) {
                description =
                    document.createElement("p");

                description.id =
                    "menu-description";

                description.style.color =
                    "#888";

                description.style.fontSize =
                    "12px";

                description.style.lineHeight =
                    "1.5";

                description.style.margin =
                    "15px 0 0 0";

                menuScreen.insertBefore(
                    description,
                    startBtn
                );
            }

            description.innerText = text;
        }

        // ============================================================
        // KEYBOARD SUPPORT
        // ============================================================

        document.addEventListener("keydown", function (e) {
            if (
                !isBattleActive ||
                chosenRoute !== "genocide"
            ) {
                return;
            }

            const moveSpeed = 12;

            switch (e.key.toLowerCase()) {
                case "arrowup":
                case "w":
                    soulY -= moveSpeed;
                    break;

                case "arrowdown":
                case "s":
                    soulY += moveSpeed;
                    break;

                case "arrowleft":
                case "a":
                    soulX -= moveSpeed;
                    break;

                case "arrowright":
                case "d":
                    soulX += moveSpeed;
                    break;

                default:
                    return;
            }

            e.preventDefault();

            soulX = Math.max(
                0,
                Math.min(
                    arena.clientWidth - 20,
                    soulX
                )
            );

            soulY = Math.max(
                0,
                Math.min(
                    arena.clientHeight - 20,
                    soulY
                )
            );

            soul.style.left =
                soulX + "px";

            soul.style.top =
                soulY + "px";
        });

        // ============================================================
        // INITIAL STATE
        // ============================================================

        setRoute("pacifist");
        setModifier("relaxed");

    </script>

</body>
</html>
