<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Interaction Engine: GENOCIDE MATRIX</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #menu-screen {
            border: 4px solid #ff0000;
            background-color: #000000;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            width: 380px;
            box-shadow: 0 0 15px #ff0000;
        }

        .start-btn {
            background-color: #ff0000;
            color: #000000;
            font-weight: bold;
            border: 2px solid #ffffff;
            font-size: 18px;
            padding: 12px;
            width: 85%;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 5px;
            transition: 0.2s;
        }

        .start-btn:hover {
            background-color: #ffffff;
            color: #ff0000;
            box-shadow: 0 0 10px #ffffff;
        }

        #battle-arena {
            position: relative;
            width: 500px;
            height: 400px;
            border: 4px solid #ffffff;
            background-color: #000000;
            display: none;
            overflow: hidden;
        }

        #boss-hp-bar {
            width: 500px;
            height: 20px;
            background-color: #550000;
            border: 2px solid #ffffff;
            margin-bottom: 10px;
            display: none;
            position: relative;
        }

        #boss-hp-fill {
            width: 100%;
            height: 100%;
            background-color: #ff0000;
            transition: width 0.3s ease;
        }

        #ghost-boss {
            position: absolute;
            top: 20px;
            left: 225px;
            font-size: 60px;
            width: 60px;
            height: 60px;
            text-align: center;
            transition: transform 0.1s ease;
        }

        #player-soul {
            position: absolute;
            bottom: 50px;
            left: 240px;
            font-size: 20px;
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 10;
        }

        .bullet {
            position: absolute;
            background-color: #ffffff;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        #ui-box {
            margin-top: 15px;
            width: 508px;
            display: none;
        }

        #dialogue {
            border: 4px solid #ffffff;
            padding: 15px;
            min-height: 60px;
            background-color: #000000;
            font-size: 16px;
            color: #ffffff;
            line-height: 1.4;
        }

        #action-menu {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .menu-btn {
            background-color: #000000;
            color: #ff8000;
            border: 3px solid #ff8000;
            padding: 10px 30px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            width: 45%;
            transition: 0.2s;
        }

        .menu-btn:hover {
            color: #ffff00;
            border-color: #ffff00;
            background-color: #221100;
        }

        #player-stats {
            display: flex;
            justify-content: space-between;
            width: 500px;
            font-size: 18px;
            margin-bottom: 5px;
            display: none;
            font-weight: bold;
        }

        .slice-effect {
            position: absolute;
            width: 4px;
            background-color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
            animation: slash 0.2s linear forwards;
        }

        @keyframes slash {
            0% { transform: scaleY(0) rotate(-45deg); opacity: 1; }
            100% { transform: scaleY(15) rotate(-45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- MENUS -->
    <div id="menu-screen">
        <h1 style="color: #ff0000; margin-top: 0; letter-spacing: 2px;">GENOCIDE DETECTED</h1>
        <p style="color: #888; font-size: 14px;">The entity remembers your aggressive data sequences. Prepare for containment breach.</p>
        <button class="start-btn" onclick="initialiseGenocideFight()">CHALLENGE ANOMALY</button>
    </div>

    <!-- STATS AND BOSS HEALTH -->
    <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
    <div id="player-stats">
        <div style="color: #ffffff;">CHARA LV 19</div>
        <div style="color: #ff0000;">HP: <span id="player-hp">99</span> / 99</div>
    </div>

    <!-- THE FIGHT BOX -->
    <div id="battle-arena">
        <div id="ghost-boss">👻</div>
        <div id="player-soul">❤️</div>
    </div>

    <!-- HUD MENU -->
    <div id="ui-box">
        <div id="dialogue">* The air is freezing.</div>
        <div id="action-menu">
            <button class="menu-btn" onclick="executePlayerAttack()">⚔️ FIGHT</button>
            <button class="menu-btn" onclick="attemptMercy()">❌ MERCY</button>
        </div>
    </div>

    <script>
        const arena = document.getElementById('battle-arena');
        const soul = document.getElementById('player-soul');
        const boss = document.getElementById('ghost-boss');
        const dialogue = document.getElementById('dialogue');
        const bossHpFill = document.getElementById('boss-hp-fill');
        const playerHpDisplay = document.getElementById('player-hp');

        let bossHp = 500;
        let playerHp = 99;
        let isBattleActive = false;
        let attackCycle;
        let bullets = [];

        // Track mouse inside arena to move the heart soul
        arena.addEventListener('mousemove', (e) => {
            if (!isBattleActive) return;
            const rect = arena.getBoundingClientRect();
            let x = e.clientX - rect.left - 10; 
            let y = e.clientY - rect.top - 10;

            // Boundaries
            if (x < 0) x = 0;
            if (x > 480) x = 480;
            if (y < 0) y = 0;
            if (y > 380) y = 380;

            soul.style.left = x + 'px';
            soul.style.top = y + 'px';
        });

        function initialiseGenocideFight() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('boss-hp-bar').style.display = 'block';
            document.getElementById('player-stats').style.display = 'flex';
            arena.style.display = 'block';
            document.getElementById('ui-box').style.display = 'block';
            
            isBattleActive = true;
            spawnBulletHell();
        }

        // Danmaku Pattern Loop
        function spawnBulletHell() {
            attackCycle = setInterval(() => {
                if (!isBattleActive) return;

                // Random side-to-side shift for the boss character
                boss.style.transform = `translateX(${Math.floor(Math.random() * 60) - 30}px)`;

                // Generate projectiles dropping from boss coordinate zone
                const b = document.createElement('div');
                b.classList.add('bullet');
                b.style.left = (parseInt(boss.style.left || 225) + 25 + (Math.floor(Math.random() * 40) - 20)) + 'px';
                b.style.top = '70px';
                
                // Flight mechanics parameters
                let angle = Math.random() * Math.PI + 0.2; 
                let speed = Math.random() * 3 + 3;

                arena.appendChild(b);
                bullets.push({ element: b, x: parseFloat(b.style.left), y: 70, speed: speed });
            }, 120);

            // Frame engine updating calculations
            requestAnimationFrame(updateProjectiles);
        }

        function updateProjectiles() {
            if (!isBattleActive) return;

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y += b.speed;
                b.element.style.top = b.y + 'px';

                // Check collision with the player soul box dimensions
                let soulX = parseInt(soul.style.left || 240);
                let soulY = parseInt(soul.style.top || 350);

                if (b.y > 400) {
                    b.element.remove();
                    bullets.splice(i, 1);
                    continue;
                }

                if (Math.abs(b.x - soulX) < 18 && Math.abs(b.y - soulY) < 18) {
                    triggerPlayerDamage();
                    b.element.remove();
                    bullets.splice(i, 1);
                }
            }
            requestAnimationFrame(updateProjectiles);
        }

        function triggerPlayerDamage() {
            playerHp -= 8;
            if (playerHp < 0) playerHp = 0;
            playerHpDisplay.innerText = playerHp;

            document.body.style.backgroundColor = '#2a0000';
            setTimeout(() => { document.body.style.backgroundColor = '#000000'; }, 50);

            if (playerHp <= 0) {
                endGameSequence(false);
            }
        }
function executePlayerAttack() { 
    if (!isBattleActive) return; 

    // Visual slice across boss coordinates 
    const slice = document.createElement('div'); 
    slice.classList.add('slice-effect'); 
    slice.style.left = '250px'; 
    slice.style.top = '40px';
    arena.appendChild(slice);
    
    setTimeout(() => slice.remove(), 200);

    // Red HP bar drop reduction calculations
    bossHp -= 65;
    if (bossHp < 0) bossHp = 0;
    bossHpFill.style.width = (bossHp / 500 * 100) + '%';

    if (bossHp <= 0) {
        endGameSequence(true);
    } else {
        dialogue.innerText = `* You struck the entity. It scales its defenses. HP left: ${bossHp}`;
    }
}
  function attemptMercy() {
            if (!isBattleActive) return;
            dialogue.innerText = "* It refuses your gesture. Your past actions have locked the container variables.";
        }

        function endGameSequence(isVictory) {
            isBattleActive = false;
            clearInterval(attackCycle);
            
            // Clean up left over elements
            bullets.forEach(b => b.element.remove());
            bullets = [];

            if (isVictory) {
                boss.style.display = 'none';
                dialogue.style.borderColor = '#ff0000';
                dialogue.style.color = '#ff0000';
                dialogue.innerText = "💀 SYSTEM PURGED: The ghost dissolved into static code. You left nothing behind but dust and cold numbers.";
            } else {
                soul.innerText = "💔";
                dialogue.style.borderColor = '#555555';
                dialogue.innerText = "* Game Over. Your determination faded into the darkness.";
            }
        }
    </script>
</body>
</html>
