
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Interaction Engine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #12121f;
            color: #ffffff;
            font-family: "Courier New", Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease;
        }

        #menu-screen {
            border: 4px solid #ffffff;
            background-color: #000000;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            width: 380px;
            max-width: calc(100vw - 30px);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        #menu-title {
            transition: color 0.5s ease;
        }

        .toggle-btn {
            background-color: #1c1c2e;
            color: #aaaaaa;
            border: 2px solid #555555;
            padding: 10px 15px;
            margin: 5px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            width: 85%;
            transition: 0.2s;
        }

        .toggle-btn:hover {
            background-color: #292942;
            color: #ffffff;
        }

        .toggle-btn.active {
            background-color: #00ffcc;
            color: #000000;
            border-color: #ffffff;
            font-weight: bold;
            transform: scale(1.05);
        }

        #route-genocide.active {
            background-color: #ff0000;
            color: #ffffff;
        }

        #start-btn {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            border: 2px solid #ffffff;
            font-size: 18px;
            padding: 12px;
            width: 85%;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 5px;
            font-family: "Courier New", Courier, monospace;
            transition: 0.2s;
        }

        #start-btn:hover {
            background-color: #00ffcc;
            border-color: #00ffcc;
        }

        #sound-btn {
            background: #111111;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 7px 12px;
            margin-top: 10px;
            cursor: pointer;
            font-family: "Courier New", Courier, monospace;
            border-radius: 4px;
        }

        #battle-arena {
            position: relative;
            width: 500px;
            height: 400px;
            max-width: calc(100vw - 20px);
            border: 4px solid #ffffff;
            background-color: #161623;
            border-radius: 10px;
            display: none;
            overflow: hidden;
            transform-origin: center center;
            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                transform 0.15s ease;
        }

        #boss-hp-bar {
            width: 500px;
            max-width: calc(100vw - 20px);
            height: 20px;
            background-color: #550000;
            border: 2px solid #ffffff;
            margin-bottom: 10px;
            display: none;
        }

        #boss-hp-fill {
            width: 100%;
            height: 100%;
            background-color: #ff0000;
            transition: width 0.1s ease;
        }

        #ghost-boss {
            position: absolute;
            top: 20px;
            left: 220px;
            font-size: 60px;
            width: 60px;
            height: 60px;
            line-height: 60px;
            text-align: center;
            cursor: pointer;
            z-index: 5;
            transition:
                transform 0.05s ease,
                left 0.15s ease,
                top 0.15s ease;
        }

        #ghost-boss:hover {
            filter: brightness(1.4);
        }

        #player-soul {
            position: absolute;
            font-size: 20px;
            width: 20px;
            height: 20px;
            line-height: 20px;
            pointer-events: none;
            z-index: 10;
        }

        .bullet {
            position: absolute;
            background-color: #ffffff;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 6px #ffffff, 0 0 12px #aaffff;
            pointer-events: none;
            z-index: 4;
        }

        #ui-box {
            margin-top: 15px;
            width: 508px;
            max-width: calc(100vw - 20px);
            display: none;
        }

        #dialogue {
            border: 4px solid #ffffff;
            padding: 15px;
            min-height: 60px;
            background-color: #000000;
            font-size: 16px;
            color: #ffffff;
            line-height: 1.4;
            border-radius: 5px;
        }

        #action-menu {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .menu-btn {
            background-color: #000000;
            color: #ff8000;
            border: 3px solid #ff8000;
            padding: 10px 30px;
            font-size: 18px;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            width: 45%;
            transition: 0.2s;
        }

        .menu-btn:hover {
            color: #ffff00;
            border-color: #ffff00;
            background-color: #221100;
        }

        #player-stats {
            display: none;
            justify-content: space-between;
            width: 500px;
            max-width: calc(100vw - 20px);
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .slice-effect {
            position: absolute;
            width: 6px;
            height: 20px;
            background-color: #ff0055;
            box-shadow: 0 0 15px #ff0000;
            animation: slash 0.15s linear forwards;
            pointer-events: none;
            z-index: 20;
        }

        .heart-pop {
            position: absolute;
            font-size: 24px;
            animation: floatUp 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 30;
        }

        .damage-number {
            position: absolute;
            color: #ff4444;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            z-index: 30;
            animation: damageFloat 0.7s ease-out forwards;
        }

        .flash {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            animation: flash 0.12s ease-out forwards;
        }

        @keyframes slash {
            0% {
                transform: scaleY(0) rotate(-45deg);
                opacity: 1;
            }

            100% {
                transform: scaleY(20) rotate(-45deg);
                opacity: 0;
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-70px) scale(1.8);
                opacity: 0;
            }
        }

        @keyframes damageFloat {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-45px);
                opacity: 0;
            }
        }

        @keyframes flash {
            0% {
                background-color: rgba(255, 0, 0, 0.45);
            }

            100% {
                background-color: rgba(255, 0, 0, 0);
            }
        }

        @media (max-width: 540px) {
            #battle-arena {
                height: min(400px, calc(100vh - 250px));
                min-height: 280px;
            }

            #player-stats {
                font-size: 14px;
            }

            #dialogue {
                font-size: 13px;
            }

            .menu-btn {
                font-size: 15px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div id="menu-screen">

    <h2
        id="menu-title"
        style="color:#ffffff;margin-top:0;letter-spacing:2px;"
    >
        GHOST REPOSITORY
    </h2>

    <p style="margin:10px 0 5px;color:#888;font-size:13px;">
        CORE PROTOCOL:
    </p>

    <button
        id="route-pacifist"
        class="toggle-btn active"
        onclick="setRoute('pacifist')"
    >
        [ PACIFIST PATH ]
    </button>

    <button
        id="route-genocide"
        class="toggle-btn"
        onclick="setRoute('genocide')"
    >
        [ HARDCORE GENOCIDE ]
    </button>

    <p style="margin:15px 0 5px;color:#888;font-size:13px;">
        CHAMBER MODIFIER:
    </p>

    <button
        id="mod-relaxed"
        class="toggle-btn active"
        onclick="setModifier('relaxed')"
    >
        [ RELAXED CHAMBER ]
    </button>

    <button
        id="mod-timer"
        class="toggle-btn"
        onclick="setModifier('timer')"
    >
        [ 30s COUNTDOWN ]
    </button>

    <button
        id="mod-mirror"
        class="toggle-btn"
        onclick="setModifier('mirror')"
    >
        [ KINETIC MIRROR ]
    </button>

    <p style="
        color:#666;
        font-size:11px;
        margin-top:15px;
        font-style:italic;
    ">
        credits to fucking max for the fucking idea of the battle i fucking guess
    </p>

    <button id="start-btn" onclick="launchGame()">
        INITIALISE MATRIX
    </button>

    <button id="sound-btn" onclick="toggleSound()">
        🔊 SOUND: ON
    </button>

</div>

<div id="boss-hp-bar">
    <div id="boss-hp-fill"></div>
</div>

<div id="player-stats">

    <div id="stat-name" style="color:#ffffff;">
        PLAYER LV 1
    </div>

    <div id="stat-hp-box" style="color:#ff4d6d;">
        HP:
        <span id="player-hp">99</span>
        /
        <span id="player-max-hp">99</span>
    </div>

</div>

<div id="battle-arena">

    <div
        id="ghost-boss"
        style="left:220px;top:170px;"
    >
        👻
    </div>

    <div
        id="player-soul"
        style="display:none;"
    >
        ❤️
    </div>

</div>

<div id="ui-box">

    <div id="dialogue">
        Calibrating personality matrices...
    </div>

    <div id="action-menu" style="display:none;">

        <button
            class="menu-btn"
            onclick="executePlayerAttack()"
        >
            [ FIGHT ]
        </button>

        <button
            class="menu-btn"
            onclick="attemptMercy()"
        >
            [ MERCY ]
        </button>

    </div>

</div>

<script>
"use strict";

/* ============================================================
   DOM
============================================================ */

const arena = document.getElementById("battle-arena");
const soul = document.getElementById("player-soul");
const boss = document.getElementById("ghost-boss");

const dialogue = document.getElementById("dialogue");
const bossHpFill = document.getElementById("boss-hp-fill");

const playerHpDisplay = document.getElementById("player-hp");
const playerMaxHpDisplay = document.getElementById("player-max-hp");

const menuScreen = document.getElementById("menu-screen");
const menuTitle = document.getElementById("menu-title");
const startBtn = document.getElementById("start-btn");

const actionMenu = document.getElementById("action-menu");
const playerStats = document.getElementById("player-stats");
const bossHpBar = document.getElementById("boss-hp-bar");

/* ============================================================
   GAME STATE
============================================================ */

let chosenRoute = "pacifist";
let chosenModifier = "relaxed";

const MAX_BOSS_HP = 600;
const MAX_PLAYER_HP = 99;

let bossHp = MAX_BOSS_HP;
let playerHp = MAX_PLAYER_HP;

let isBattleActive = false;
let gameEnding = false;

let timeLeft = 30;

let countdownInterval = null;
let attackCycle = null;
let mirrorCycle = null;
let pacifistMoveCycle = null;

let bullets = [];

let soulX = 240;
let soulY = 320;

let pacifistClicks = 0;
let karmaPoints = 0;
let lastClickTime = 0;

/* ============================================================
   AUDIO ENGINE
============================================================ */

let audioContext = null;
let masterGain = null;

let soundEnabled = true;
let audioUnlocked = false;

function initAudio() {

    if (audioUnlocked && audioContext) {
        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        return;
    }

    try {

        audioContext =
            new (window.AudioContext ||
                window.webkitAudioContext)();

        masterGain =
            audioContext.createGain();

        masterGain.gain.value = 0.16;

        masterGain.connect(
            audioContext.destination
        );

        audioUnlocked = true;

    } catch (error) {

        console.warn(
            "Web Audio is unavailable.",
            error
        );

    }
}

function toggleSound() {

    initAudio();

    soundEnabled = !soundEnabled;

    document.getElementById("sound-btn").innerText =
        soundEnabled
            ? "🔊 SOUND: ON"
            : "🔇 SOUND: OFF";

    if (soundEnabled) {
        playSelectSound();
    }
}

function playTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.15,
    slideTo = null
) {

    if (!soundEnabled) return;

    initAudio();

    if (!audioContext || !masterGain) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.setValueAtTime(
        frequency,
        audioContext.currentTime
    );

    if (slideTo !== null) {

        oscillator.frequency.exponentialRampToValueAtTime(
            Math.max(1, slideTo),
            audioContext.currentTime + duration
        );

    }

    gain.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioContext.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration + 0.02
    );
}

/* ============================================================
   NOISE GENERATOR
============================================================ */

function playNoise(
    duration = 0.15,
    volume = 0.12
) {

    if (!soundEnabled) return;

    initAudio();

    if (!audioContext || !masterGain) return;

    const bufferSize =
        audioContext.sampleRate * duration;

    const buffer =
        audioContext.createBuffer(
            1,
            bufferSize,
            audioContext.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {

        data[i] =
            Math.random() * 2 - 1;

    }

    const source =
        audioContext.createBufferSource();

    const gain =
        audioContext.createGain();

    source.buffer = buffer;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + duration
    );

    source.connect(gain);
    gain.connect(masterGain);

    source.start();
}

/* ============================================================
   SOUND EFFECTS
============================================================ */

function playSelectSound() {

    playTone(
        420,
        0.07,
        "square",
        0.08,
        620
    );
}

function playGhostSound() {

    playTone(
        220,
        0.35,
        "sine",
        0.08,
        130
    );

    setTimeout(() => {

        playTone(
            165,
            0.45,
            "sine",
            0.06,
            100
        );

    }, 120);
}

function playPacifistSound() {

    playTone(
        523.25,
        0.12,
        "sine",
        0.13,
        659.25
    );

    setTimeout(() => {

        playTone(
            783.99,
            0.16,
            "sine",
            0.11,
            1046.5
        );

    }, 80);
}

function playHeartBreakSound() {

    playTone(
        280,
        0.18,
        "sawtooth",
        0.10,
        130
    );

    playNoise(
        0.08,
        0.05
    );
}

function playSlashSound() {

    playNoise(
        0.12,
        0.12
    );

    playTone(
        850,
        0.09,
        "sawtooth",
        0.08,
        180
    );
}

function playHitSound() {

    playTone(
        90,
        0.18,
        "square",
        0.15,
        45
    );

    playNoise(
        0.13,
        0.08
    );
}

function playDamageSound() {

    playTone(
        150,
        0.18,
        "square",
        0.13,
        60
    );

    setTimeout(() => {

        playTone(
            75,
            0.20,
            "sawtooth",
            0.08,
            40
        );

    }, 50);
}

function playCountdownSound() {

    playTone(
        timeLeft <= 5 ? 880 : 440,
        0.08,
        "square",
        0.08
    );
}

function playMirrorSound() {

    playTone(
        150,
        0.25,
        "sawtooth",
        0.06,
        600
    );

    playTone(
        310,
        0.25,
        "triangle",
        0.05,
        100
    );
}

function playVictorySound() {

    const notes = [
        523.25,
        659.25,
        783.99,
        1046.5
    ];

    notes.forEach((note, index) => {

        setTimeout(() => {

            playTone(
                note,
                0.25,
                "sine",
                0.13
            );

        }, index * 130);

    });
}

function playGameOverSound() {

    playTone(
        220,
        0.35,
        "sawtooth",
        0.12,
        100
    );

    setTimeout(() => {

        playTone(
            150,
            0.5,
            "sawtooth",
            0.10,
            55
        );

    }, 200);

    setTimeout(() => {

        playNoise(
            0.4,
            0.06
        );

    }, 350);
}

/* ============================================================
   ROUTE SELECTION
============================================================ */

function setModifier(mod) {

    chosenModifier = mod;

    document
        .getElementById("mod-relaxed")
        .classList.remove("active");

    document
        .getElementById("mod-timer")
        .classList.remove("active");

    document
        .getElementById("mod-mirror")
        .classList.remove("active");

    document
        .getElementById("mod-" + mod)
        .classList.add("active");

    playSelectSound();
}

function setRoute(route) {

    chosenRoute = route;

    document
        .getElementById("route-pacifist")
        .classList.remove("active");

    document
        .getElementById("route-genocide")
        .classList.remove("active");

    document
        .getElementById("route-" + route)
        .classList.add("active");

    if (route === "genocide") {

        menuScreen.style.borderColor =
            "#ff0000";

        menuTitle.style.color =
            "#ff0000";

    } else {

        menuScreen.style.borderColor =
            "#ffffff";

        menuTitle.style.color =
            "#ffffff";
    }

    menuScreen.style.boxShadow =
        "none";

    playSelectSound();
}

/* ============================================================
   RESET
============================================================ */

function clearAllTimers() {

    if (countdownInterval !== null) {
        clearInterval(countdownInterval);
        countdownInterval = null;
    }

    if (attackCycle !== null) {
        clearInterval(attackCycle);
        attackCycle = null;
    }

    if (mirrorCycle !== null) {
        clearInterval(mirrorCycle);
        mirrorCycle = null;
    }

    if (pacifistMoveCycle !== null) {
        clearInterval(pacifistMoveCycle);
        pacifistMoveCycle = null;
    }
}

function resetGameState() {

    clearAllTimers();

    bullets.forEach(bullet => {

        if (
            bullet.element &&
            bullet.element.parentNode
        ) {
            bullet.element.remove();
        }

    });

    bullets = [];

    bossHp = MAX_BOSS_HP;
    playerHp = MAX_PLAYER_HP;

    timeLeft = 30;

    pacifistClicks = 0;
    karmaPoints = 0;
    lastClickTime = 0;

    soulX = 240;
    soulY = 320;

    gameEnding = false;

    playerHpDisplay.innerText =
        MAX_PLAYER_HP;

    playerMaxHpDisplay.innerText =
        MAX_PLAYER_HP;

    bossHpFill.style.width =
        "100%";

    arena.style.transform =
        "rotate(0deg) scale(1)";

    boss.style.left =
        "220px";

    boss.style.top =
        "170px";

    boss.style.transform =
        "translateX(0)";

    soul.style.left =
        "240px";

    soul.style.top =
        "320px";

    document.body.style.backgroundColor =
        "#12121f";

    menuTitle.innerText =
        "GHOST REPOSITORY";

    menuScreen.style.boxShadow =
        "none";

    if (chosenRoute === "genocide") {

        menuTitle.style.color =
            "#ff0000";

        menuScreen.style.borderColor =
            "#ff0000";

    } else {

        menuTitle.style.color =
            "#ffffff";

        menuScreen.style.borderColor =
            "#ffffff";
    }

    startBtn.innerText =
        "INITIALISE MATRIX";
}

/* ============================================================
   START GAME
============================================================ */

function launchGame() {

    initAudio();

    playSelectSound();

    resetGameState();

    menuScreen.style.display =
        "none";

    arena.style.display =
        "block";

    playerStats.style.display =
        "flex";

    document.getElementById("ui-box")
        .style.display =
        "block";

    isBattleActive = true;

    if (chosenModifier === "timer") {
        startGlobalTimer();
    }

    if (chosenModifier === "mirror") {
        startMirrorModifier();
    }

    if (chosenRoute === "genocide") {
        setupGenocideFight();
    } else {
        setupPacifistChamber();
    }
}

/* ============================================================
   TIMER
============================================================ */

function startGlobalTimer() {

    clearInterval(countdownInterval);

    timeLeft = 30;

    updateTimerDialogue();

    countdownInterval =
        setInterval(() => {

            if (!isBattleActive) {

                clearInterval(
                    countdownInterval
                );

                return;
            }

            timeLeft--;

            updateTimerDialogue();

            if (timeLeft <= 10) {
                playCountdownSound();
            }

            if (timeLeft <= 0) {

                clearInterval(
                    countdownInterval
                );

                countdownInterval = null;

                if (
                    chosenRoute === "pacifist"
                ) {

                    endGameSequence(true);

                } else {

                    endGameSequence(false);
                }
            }

        }, 1000);
}

function updateTimerDialogue() {

    if (
        chosenModifier === "timer" &&
        isBattleActive
    ) {

        dialogue.innerText =
            "* Time Remaining: " +
            Math.max(0, timeLeft) +
            "s";
    }
}

/* ============================================================
   GENOCIDE MODE
============================================================ */

function setupGenocideFight() {

    document.body.style.backgroundColor =
        "#000000";

    arena.style.backgroundColor =
        "#000000";

    arena.style.borderColor =
        "#ffffff";

    bossHpBar.style.display =
        "block";

    document.getElementById("stat-name")
        .innerText =
        "PLAYER LV 19";

    playerHp =
        MAX_PLAYER_HP;

    playerHpDisplay.innerText =
        playerHp;

    bossHp =
        MAX_BOSS_HP;

    bossHpFill.style.width =
        "100%";

    boss.style.left =
        "220px";

    boss.style.top =
        "20px";

    soul.style.display =
        "block";

    soul.style.left =
        soulX + "px";

    soul.style.top =
        soulY + "px";

    actionMenu.style.display =
        "flex";

    dialogue.innerText =
        "* The anomaly blocks the exit path.";

    playGhostSound();

    spawnBulletHell();
}

function spawnBulletHell() {

    clearInterval(attackCycle);

    attackCycle =
        setInterval(() => {

            if (
                !isBattleActive ||
                chosenRoute !== "genocide"
            ) {
                return;
            }

            const ghostOffset =
                Math.floor(
                    Math.random() * 80
                ) - 40;

            boss.style.transform =
                "translateX(" +
                ghostOffset +
                "px)";

            const bullet =
                document.createElement("div");

            bullet.classList.add("bullet");

            const bossLeft =
                parseFloat(boss.style.left) ||
                220;

            const bossTop =
                parseFloat(boss.style.top) ||
                20;

            const startX =
                bossLeft + 25;

            const startY =
                bossTop + 50;

            bullet.style.left =
                startX + "px";

            bullet.style.top =
                startY + "px";

            arena.appendChild(bullet);

            const diffX =
                soulX - startX;

            const diffY =
                soulY - startY;

            const distance =
                Math.sqrt(
                    diffX * diffX +
                    diffY * diffY
                ) || 1;

            const speed =
                chosenModifier === "mirror"
                    ? 5.5
                    : 4.5;

            const velocityX =
                (diffX / distance) *
                speed;

            const velocityY =
                (diffY / distance) *
                speed;

            bullets.push({
                element: bullet,
                x: startX,
                y: startY,
                vx: velocityX,
                vy: velocityY
            });

        }, 90);

    requestAnimationFrame(
        updateProjectiles
    );
}

function updateProjectiles() {

    if (
        !isBattleActive ||
        chosenRoute !== "genocide"
    ) {
        return;
    }

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];

        bullet.x += bullet.vx;
        bullet.y += bullet.vy;

        bullet.element.style.left =
            bullet.x + "px";

        bullet.element.style.top =
            bullet.y + "px";

        if (
            bullet.y >
                arena.clientHeight + 20 ||
            bullet.y < -20 ||
            bullet.x >
                arena.clientWidth + 20 ||
            bullet.x < -20
        ) {

            removeBullet(i);

            continue;
        }

        if (
            Math.abs(
                bullet.x -
                (soulX + 10)
            ) < 14 &&
            Math.abs(
                bullet.y -
                (soulY + 10)
            ) < 14
        ) {

            triggerPlayerDamage();

            removeBullet(i);
        }
    }

    if (isBattleActive) {

        requestAnimationFrame(
            updateProjectiles
        );
    }
}

function removeBullet(index) {

    const bullet =
        bullets[index];

    if (
        bullet &&
        bullet.element &&
        bullet.element.parentNode
    ) {
        bullet.element.remove();
    }

    bullets.splice(index, 1);
}

/* ============================================================
   PLAYER DAMAGE
============================================================ */

function triggerPlayerDamage() {

    if (!isBattleActive) {
        return;
    }

    playerHp -= 12;

    if (playerHp < 0) {
        playerHp = 0;
    }

    playerHpDisplay.innerText =
        playerHp;

    playDamageSound();

    flashDamage();

    if (playerHp <= 24) {

        document.getElementById(
            "stat-hp-box"
        ).style.color =
            "#ff0000";
    }

    if (playerHp <= 0) {

        endGameSequence(false);
    }
}

function flashDamage() {

    document.body.style.backgroundColor =
        "#4a0000";

    const flash =
        document.createElement("div");

    flash.className =
        "flash";

    arena.appendChild(flash);

    setTimeout(() => {

        if (flash.parentNode) {
            flash.remove();
        }

    }, 130);

    setTimeout(() => {

        document.body.style.backgroundColor =
            chosenRoute === "genocide"
                ? "#000000"
                : "#12121f";

    }, 80);
}

/* ============================================================
   ATTACK
============================================================ */

function executePlayerAttack() {

    if (
        !isBattleActive ||
        chosenRoute !== "genocide"
    ) {
        return;
    }

    playSlashSound();

    const slice =
        document.createElement("div");

    slice.classList.add(
        "slice-effect"
    );

    slice.style.left =
        soulX + "px";

    slice.style.top =
        Math.max(
            0,
            soulY - 100
        ) + "px";

    arena.appendChild(slice);

    setTimeout(() => {

        if (slice.parentNode) {
            slice.remove();
        }

    }, 150);

    bossHp -= 50;

    if (bossHp < 0) {
        bossHp = 0;
    }

    bossHpFill.style.width =
        (bossHp / MAX_BOSS_HP) *
        100 +
        "%";

    playHitSound();

    spawnDamageNumber(
        boss.style.left,
        boss.style.top,
        50
    );

    boss.style.transform =
        "translateX(0) scale(0.9)";

    setTimeout(() => {

        if (isBattleActive) {

            boss.style.transform =
                "translateX(0) scale(1)";
        }

    }, 80);

    if (bossHp <= 0) {

        endGameSequence(true);

    } else {

        dialogue.innerText =
            "* Real damage logged. Anomaly HP left: " +
            bossHp;
    }
}

/* ============================================================
   MERCY
============================================================ */

function attemptMercy() {

    if (!isBattleActive) {
        return;
    }

    if (chosenRoute === "genocide") {

        playTone(
            100,
            0.15,
            "square",
            0.06
        );

        dialogue.innerText =
            "* Your hands remain covered in static dust. MERCY is locked out.";

    } else {

        dialogue.innerText =
            "* You cannot attack the ghost on this route. Try interacting with it.";
    }
}

/* ============================================================
   DAMAGE NUMBER
============================================================ */

function spawnDamageNumber(
    x,
    y,
    amount
) {

    const number =
        document.createElement("div");

    number.className =
        "damage-number";

    number.innerText =
        "-" + amount;

    number.style.left =
        parseFloat(x || 220) +
        20 +
        "px";

    number.style.top =
        parseFloat(y || 20) +
        "px";

    arena.appendChild(number);

    setTimeout(() => {

        if (number.parentNode) {
            number.remove();
        }

    }, 700);
}

/* ============================================================
   PACIFIST MODE
============================================================ */

function setupPacifistChamber() {

    document.body.style.backgroundColor =
        "#12121f";

    arena.style.backgroundColor =
        "#161623";

    arena.style.borderColor =
        "#ffffff";

    bossHpBar.style.display =
        "none";

    document.getElementById("stat-name")
        .innerText =
        "PLAYER LV 1";

    playerHpDisplay.innerText =
        "0";

    playerMaxHpDisplay.innerText =
        "20";

    soul.style.display =
        "none";

    actionMenu.style.display =
        "none";

    boss.style.left =
        "220px";

    boss.style.top =
        "170px";

    boss.style.transform =
        "translateX(0)";

    dialogue.innerText =
        "* A lonely ghost flickers in the chamber.";

    playGhostSound();

    pacifistMoveCycle =
        setInterval(() => {

            if (!isBattleActive) {
                return;
            }

            moveGhostRandomly();

        }, 1800);
}

function moveGhostRandomly() {

    if (
        !isBattleActive ||
        chosenRoute !== "pacifist"
    ) {
        return;
    }

    const maxX =
        arena.clientWidth - 70;

    const maxY =
        arena.clientHeight - 70;

    const newX =
        Math.floor(
            Math.random() *
            Math.max(1, maxX)
        );

    const newY =
        Math.floor(
            Math.random() *
            Math.max(1, maxY)
        );

    boss.style.left =
        newX + "px";

    boss.style.top =
        newY + "px";
}

/* ============================================================
   GHOST CLICK
============================================================ */

boss.addEventListener(
    "click",
    function (event) {

        if (
            !isBattleActive ||
            chosenRoute !== "pacifist"
        ) {
            return;
        }

        pacifistClicks++;

        playerHpDisplay.innerText =
            pacifistClicks;

        const currentTime =
            Date.now();

        const timeDiff =
            currentTime -
            lastClickTime;

        const wasFirstClick =
            lastClickTime === 0;

        lastClickTime =
            currentTime;

        if (
            !wasFirstClick &&
            timeDiff < 500
        ) {

            karmaPoints--;

            playHeartBreakSound();

            spawnParticle(
                event.offsetX,
                event.offsetY,
                "💔"
            );

            dialogue.innerText =
                "* The ghost recoils from your frantic energy.";

        } else {

            karmaPoints++;

            playPacifistSound();

            spawnParticle(
                event.offsetX,
                event.offsetY,
                "💖"
            );

            dialogue.innerText =
                "* The ghost seems strangely comforted.";
        }

        if (pacifistClicks >= 20) {

            endGameSequence(true);

            return;
        }

        moveGhostRandomly();
    }
);

/* ============================================================
   PARTICLES
============================================================ */

function spawnParticle(
    x,
    y,
    symbol
) {

    const particle =
        document.createElement("div");

    particle.className =
        "heart-pop";

    particle.innerText =
        symbol;

    particle.style.left =
        x + "px";

    particle.style.top =
        y + "px";

    arena.appendChild(particle);

    setTimeout(() => {

        if (particle.parentNode) {
            particle.remove();
        }

    }, 600);
}

/* ============================================================
   MIRROR MODE
============================================================ */

function startMirrorModifier() {

    clearInterval(mirrorCycle);

    mirrorCycle =
        setInterval(() => {

            applyMirrorDistortion();

        }, 900);
}

function applyMirrorDistortion() {

    if (
        chosenModifier !== "mirror" ||
        !isBattleActive
    ) {
        return;
    }

    const rotation =
        Math.random() * 20 - 10;

    const scale =
        1 + Math.random() * 0.05;

    arena.style.transform =
        "rotate(" +
        rotation +
        "deg) scale(" +
        scale +
        ")";

    if (Math.random() < 0.25) {

        arena.style.transform +=
            " scaleX(-1)";
    }

    playMirrorSound();

    setTimeout(() => {

        if (isBattleActive) {

            arena.style.transform =
                "rotate(0deg) scale(1)";
        }

    }, 150);
}

/* ============================================================
   MOUSE CONTROL
============================================================ */

arena.addEventListener(
    "mousemove",
    function (event) {

        if (
            !isBattleActive ||
            chosenRoute !== "genocide"
        ) {
            return;
        }

        const rect =
            arena.getBoundingClientRect();

        let newX =
            event.clientX -
            rect.left -
            10;

        let newY =
            event.clientY -
            rect.top -
            10;

        newX = Math.max(
            0,
            Math.min(
                arena.clientWidth - 20,
                newX
            )
        );

        newY = Math.max(
            0,
            Math.min(
                arena.clientHeight - 20,
                newY
            )
        );

        soulX = newX;
        soulY = newY;

        soul.style.left =
            soulX + "px";

        soul.style.top =
            soulY + "px";
    }
);

/* ============================================================
   TOUCH CONTROL
============================================================ */

arena.addEventListener(
    "touchmove",
    function (event) {

        if (
            !isBattleActive ||
            chosenRoute !== "genocide"
        ) {
            return;
        }

        event.preventDefault();

        const touch =
            event.touches[0];

        const rect =
            arena.getBoundingClientRect();

        let newX =
            touch.clientX -
            rect.left -
            10;

        let newY =
            touch.clientY -
            rect.top -
            10;

        newX = Math.max(
            0,
            Math.min(
                arena.clientWidth - 20,
                newX
            )
        );

        newY = Math.max(
            0,
            Math.min(
                arena.clientHeight - 20,
                newY
            )
        );

        soulX = newX;
        soulY = newY;

        soul.style.left =
            soulX + "px";

        soul.style.top =
            soulY + "px";
    },
    { passive: false }
);

/* ============================================================
   KEYBOARD
============================================================ */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            !isBattleActive ||
            chosenRoute !== "genocide"
        ) {
            return;
        }

        const speed = 12;

        switch (
            event.key.toLowerCase()
        ) {

            case "arrowup":
            case "w":
                soulY -= speed;
                break;

            case "arrowdown":
            case "s":
                soulY += speed;
                break;

            case "arrowleft":
            case "a":
                soulX -= speed;
                break;

            case "arrowright":
            case "d":
                soulX += speed;
                break;

            default:
                return;
        }

        event.preventDefault();

        soulX = Math.max(
            0,
            Math.min(
                arena.clientWidth - 20,
                soulX
            )
        );

        soulY = Math.max(
            0,
            Math.min(
                arena.clientHeight - 20,
                soulY
            )
        );

        soul.style.left =
            soulX + "px";

        soul.style.top =
            soulY + "px";
    }
);

/* ============================================================
   END GAME
============================================================ */

function endGameSequence(isVictory) {

    if (gameEnding) {
        return;
    }

    gameEnding = true;
    isBattleActive = false;

    clearAllTimers();

    bullets.forEach(bullet => {

        if (
            bullet.element &&
            bullet.element.parentNode
        ) {
            bullet.element.remove();
        }

    });

    bullets = [];

    arena.style.transform =
        "rotate(0deg) scale(1)";

    if (isVictory) {
        playVictorySound();
    } else {
        playGameOverSound();
    }

    setTimeout(() => {

        arena.style.display =
            "none";

        bossHpBar.style.display =
            "none";

        playerStats.style.display =
            "none";

        document.getElementById("ui-box")
            .style.display =
            "none";

        soul.style.display =
            "none";

        menuScreen.style.display =
            "block";

        if (
            chosenRoute ===
            "genocide"
        ) {

            handleGenocideEnding(
                isVictory
            );

        } else {

            handlePacifistEnding(
                isVictory
            );
        }

        startBtn.innerText =
            "RE-INITIALISE ENGINE";

        gameEnding = false;

    }, 1000);
}

/* ============================================================
   GENOCIDE ENDING
============================================================ */

function handleGenocideEnding(
    isVictory
) {

    if (isVictory) {

        document.body.style.backgroundColor =
            "#001a14";

        menuTitle.innerText =
            "SYSTEM PURGED";

        menuTitle.style.color =
            "#00ffcc";

        menuScreen.style.borderColor =
            "#00ffcc";

        menuScreen.style.boxShadow =
            "0 0 20px #00ffcc";

        setMenuDescription(
            "The ghost dissolved into static code. You left nothing behind but dust and cold numbers."
        );

    } else {

        document.body.style.backgroundColor =
            "#1a0000";

        menuTitle.innerText =
            "GAME OVER";

        menuTitle.style.color =
            "#ff0000";

        menuScreen.style.borderColor =
            "#ff0000";

        menuScreen.style.boxShadow =
            "0 0 20px #ff0000";

        setMenuDescription(
            "Your determination shattered under the pressure of the localized timeline loop."
        );
    }
}

/* ============================================================
   PACIFIST ENDING
============================================================ */

function handlePacifistEnding(
    isVictory
) {

    if (
        isVictory &&
        karmaPoints >= 0
    ) {

        document.body.style.backgroundColor =
            "#1a3a2a";

        menuTitle.innerText =
            "TRUE PACIFIST";

        menuTitle.style.color =
            "#00ffcc";

        menuScreen.style.borderColor =
            "#00ffcc";

        menuScreen.style.boxShadow =
            "0 0 20px #00ffcc";

        setMenuDescription(
            "🌸 You treated the entity with absolute patience and respect. You are bonded forever."
        );

    } else {

        document.body.style.backgroundColor =
            "#3a0a0a";

        menuTitle.innerText =
            "NEUTRAL CORRUPTION";

        menuTitle.style.color =
            "#ff0000";

        menuScreen.style.borderColor =
            "#ff0000";

        menuScreen.style.boxShadow =
            "0 0 20px #ff0000";

        setMenuDescription(
            "💀 Your aggressive speed and clicking tore the soul apart."
        );
    }
}

/* ============================================================
   MENU DESCRIPTION
============================================================ */

function setMenuDescription(text) {

    let description =
        document.getElementById(
            "menu-description"
        );

    if (!description) {

        description =
            document.createElement("p");

        description.id =
            "menu-description";

        description.style.color =
            "#888";

        description.style.fontSize =
            "12px";

        description.style.lineHeight =
            "1.5";

        description.style.margin =
            "15px 0 0 0";

        menuScreen.insertBefore(
            description,
            startBtn
        );
    }

    description.innerText =
        text;
}

/* ============================================================
   INITIAL STATE
============================================================ */

setRoute("pacifist");
setModifier("relaxed");

</script>

</body>
