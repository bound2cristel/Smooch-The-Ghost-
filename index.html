<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooch the Ghost!</title>
    <style>
        /* This sets up the dark, retro game room aesthetic */
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        /* This is the 400x400 box the ghost floats inside of */
        #game-container {
            position: relative;
            width: 400px;
            height: 400px;
            border: 4px solid #ffffff;
            background-color: #161623;
            border-radius: 10px;
        }

        /* This styles the ghost emoji and makes its movement smooth */
        #ghost {
            position: absolute;
            font-size: 50px;
            transition: all 0.4s ease; /* Makes the ghost slide smoothly instead of teleporting */
            width: 50px;
            height: 50px;
            text-align: center;
            line-height: 50px;
            cursor: pointer;
        }

        /* This styles the UI layout below the game box */
        #ui-box {
            margin-top: 20px;
            text-align: center;
            width: 400px;
        }

        #score-board {
            font-size: 24px;
            color: #ff4d6d;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* This is the Undertale-style black dialogue box */
        #dialogue {
            border: 2px solid #ffffff;
            padding: 10px;
            min-height: 40px;
            background-color: #000000;
            border-radius: 5px;
            font-size: 14px;
        }

        /* This creates the floating heart animation effect when clicked */
        .heart-pop {
            position: absolute;
            color: #ff4d6d;
            font-size: 24px;
            animation: floatUp 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- This shows your score on the screen -->
    <div id="score-board">💝 Love Points: <span id="score">0</span></div>
    
    <!-- This is the play area -->
    <div id="game-container">
        <div id="ghost">👻</div>
    </div>

    <!-- This is the text box where the ghost speaks to you -->
    <div id="ui-box">
        <div id="dialogue">Click the ghost to give them a little smooch...</div>
    </div>

    <script>
        // STEP 1: Grab all the HTML elements so JavaScript can manipulate them
        const ghost = document.getElementById('ghost');
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const dialogue = document.getElementById('dialogue');

        // STEP 2: Create a variable to keep track of the score
        let score = 0;

        // STEP 3: The math function that moves the ghost to a random spot
        function moveGhost() {
            // We subtract the ghost's size so it doesn't accidentally clip out of the right/bottom borders
            const maxX = container.clientWidth - ghost.clientWidth;
            const maxY = container.clientHeight - ghost.clientHeight;
            
            // Pick a random whole number between 0 and the max boundaries
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            // Apply the new pixel positions to the ghost's CSS styles
            ghost.style.left = randomX + 'px';
            ghost.style.top = randomY + 'px';
        }

        // STEP 4: A function that creates a floating heart right where you clicked
        function spawnHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('heart-pop');
            heart.innerText = '💖';
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            container.appendChild(heart);

            // Automatically delete the heart from the code after 600 milliseconds so the game stays clean
            setTimeout(() => {
                heart.remove();
            }, 600);
        }

        // STEP 5: Tell the computer to wait and listen for a click on the ghost
        ghost.addEventListener('click', (e) => {
            // Increase score by 1 and update the text on the screen
            score++;
            scoreDisplay.innerText = score;

            // Calculate exactly where your mouse clicked inside the game box
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left - 12;
            const y = e.clientY - rect.top - 25;

            // Trigger the heart explosion and move the ghost to a new spot
            spawnHeart(x, y);
            moveGhost();

            // STEP 6: Check the score variable and change the text based on milestones!
            if (score === 1) {
                dialogue.innerText = "What are you doing?";
            } else if (score === 5) {
                dialogue.innerText = "Haha, that tickles!";
            } else if (score === 10) {
                dialogue.innerText = "Haha!";
            } else if (score === 20) {
                dialogue.innerText = "best friends ?";
            } else if (score === 35) {
                dialogue.innerText = "My heart is melting!";
            } else if (score === 50) {
                dialogue.innerText = "Keep clicking! I love the attention!";
            }
        });

        // Run this function once right at the start so the ghost isn't stuck in the top corner when the page loads
        moveGhost();
    </script>
</body>
</html>
