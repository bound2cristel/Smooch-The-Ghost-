
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Interaction Engine</title>
    <style>
        body {
            background-color: #12121f;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            transition: background-color 1s ease;
        }

        #menu-screen {
            border: 4px solid #ffffff;
            background-color: #000000;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            width: 380px;
        }

        .toggle-btn {
            background-color: #1c1c2e;
            color: #aaaaaa;
            border: 2px solid #555555;
            padding: 10px 15px;
            margin: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            width: 85%;
            transition: 0.2s;
        }

        .toggle-btn.active {
            background-color: #00ffcc;
            color: #000000;
            border-color: #ffffff;
            font-weight: bold;
            transform: scale(1.05);
        }

        #start-btn {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            border: 2px solid #ffffff;
            font-size: 18px;
            padding: 12px;
            width: 85%;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 5px;
        }

        #game-container {
            position: relative;
            width: 400px;
            height: 400px;
            border: 4px solid #ffffff;
            background-color: #161623;
            border-radius: 10px;
            display: none;
            transition: all 0.4s ease;
        }

        #ghost {
            position: absolute;
            font-size: 50px;
            transition: all 0.3s ease;
            width: 50px;
            height: 50px;
            text-align: center;
            line-height: 50px;
            cursor: pointer;
        }

        #ui-box {
            margin-top: 20px;
            text-align: center;
            width: 400px;
            display: none;
        }

        #score-board {
            font-size: 22px;
            color: #ff4d6d;
            font-weight: bold;
            margin-bottom: 10px;
            display: none;
            width: 400px;
            justify-content: space-between;
        }

        #dialogue {
            border: 2px solid #ffffff;
            padding: 10px;
            min-height: 40px;
            background-color: #000000;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.5s ease;
        }

        .heart-pop {
            position: absolute;
            font-size: 24px;
            animation: floatUp 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-70px) scale(1.8); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- CLEAN SELECTION MENU -->
    <div id="menu-screen">
        <h2 style="color: #ffffff; margin-top: 0; letter-spacing: 2px;">GHOST REPOSITORY</h2>
        <p style="margin-bottom: 20px; color: #888;">Select an anomaly container execution rate:</p>
        <button id="speed-relaxed" class="toggle-btn active" onclick="setSpeed('relaxed')"> Relaxed Chamber</button>
        <button id="speed-timer" class="toggle-btn" onclick="setSpeed('timer')">⏱️ 30-Second Countdown</button>
        <button id="speed-mirror" class="toggle-btn" onclick="setSpeed('mirror')"> Kinetic Mirror</button>
        <button id="start-btn" onclick="launchGame()">INITIALISE MATRIX</button>
    </div>

    <!-- MAIN INTERACTIVE SPACE -->
    <div id="score-board">
        <div>💝 Clicks: <span id="score">0</span></div>
        <div id="timer-display" style="color: #00ffcc; display: none;">⏳ Time: 30s</div>
    </div>
    
    <div id="game-container">
        <div id="ghost">👻</div>
    </div>

    <div id="ui-box">
        <div id="dialogue">Calibrating personality matrices...</div>
    </div>

    <script>
        const ghost = document.getElementById('ghost');
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const dialogue = document.getElementById('dialogue');
        const menuScreen = document.getElementById('menu-screen');
        const timerDisplay = document.getElementById('timer-display');
        const scoreBoard = document.getElementById('score-board');
        const uiBox = document.getElementById('ui-box');

        let chosenSpeed = 'relaxed';
        let score = 0;
        let gameActive = false;
        let speedTimer;
        let timeLeft = 30;

        // SECRET SELECTION METRICS
        let karmaPoints = 0;
        let lastClickTime = 0;

        function setSpeed(speed) {
            chosenSpeed = speed;
            document.getElementById('speed-relaxed').classList.remove('active');
            document.getElementById('speed-timer').classList.remove('active');
            document.getElementById('speed-mirror').classList.remove('active');
            document.getElementById('speed-' + speed).classList.add('active');
        }

        function launchGame() {
            menuScreen.style.display = 'none';
            container.style.display = 'block';
            scoreBoard.style.display = 'flex';
            uiBox.style.display = 'block';
            gameActive = true;
            lastClickTime = Date.now();

            dialogue.innerText = "A quiet ghost appears. What are your intentions?";

            if (chosenSpeed === 'timer') {
                timerDisplay.style.display = 'block';
                startCountdownLoop();
            }

            moveGhost();
        }

        function moveGhost() {
            if (!gameActive) return;
            const maxX = container.clientWidth - ghost.clientWidth;
            const maxY = container.clientHeight - ghost.clientHeight;
            ghost.style.left = Math.floor(Math.random() * maxX) + 'px';
            ghost.style.top = Math.floor(Math.random() * maxY) + 'px';
        }

        function spawnParticle(x, y, symbol) {
            const part = document.createElement('div');
            part.classList.add('heart-pop');
            part.innerText = symbol;
            part.style.left = x + 'px';
            part.style.top = y + 'px';
            container.appendChild(part);
            setTimeout(() => { part.remove(); }, 600);
        }

        function startCountdownLoop() {
            speedTimer = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `⏳ Time: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(speedTimer);
                    evaluateFinalEnding();
                }
            }, 1000);
        }

        function evaluateFinalEnding() {
            gameActive = false;
            clearInterval(speedTimer);
            ghost.style.display = 'none';
            container.style.transform = 'rotate(0deg)';

            if (karmaPoints >= 0) {
                document.body.style.backgroundColor = '#1a3a2a';
                container.style.borderColor = '#00ffcc';
                dialogue.style.color = '#00ffcc';
                dialogue.innerText = "🌸 TRUE PACIFIST: You treated the entity with absolute patience and respect. You are bonded forever.";
            } else {
                document.body.style.backgroundColor = '#3a0a0a';
                container.style.borderColor = '#ff0000';
                dialogue.style.color = '#ff0000';
                dialogue.innerText = "💀 CORRUPTED GENOCIDE: Your aggressive speed tore the software grid apart. The ghost fled in terror.";
            }
        }

        ghost.addEventListener('click', (e) => {
            if (!gameActive) return;

            score++;
            scoreDisplay.innerText = score;

            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left - 12;
            const y = e.clientY - rect.top - 25;

            const currentTime = Date.now();
            const timeGap = currentTime - lastClickTime;
            lastClickTime = currentTime;

            if (timeGap < 1500) {
                karmaPoints--;
            } else {
                karmaPoints++;
            }

            let particle = '💖';
            if (karmaPoints < -5) {
                ghost.innerText = '😈';
                container.style.borderColor = '#ff0000';
                dialogue.style.color = '#ff0000';
                particle = '💥';
            } else if (karmaPoints > 5) {
                ghost.innerText = '🌸👻🌸';
                container.style.borderColor = '#00ffcc';
                dialogue.style.color = '#00ffcc';
                particle = '🌸';
            } else {
                ghost.innerText = '👻';
                container.style.borderColor = '#ffffff';
                dialogue.style.color = '#ffffff';
            }

            if (score === 5) {
                dialogue.innerText = (karmaPoints >= 0) ? "What are you doing?" : "Hey! Stop clicking so fast!";
            } else if (score === 15) {
                dialogue.innerText = (karmaPoints >= 0) ? "best friends ?" : "You're starting to hurt me...";
            } else if (score === 30) {
                evaluateFinalEnding();
                return;
            }

            spawnParticle(x, y, particle);
            moveGhost();

            if (chosenSpeed === 'mirror') {
                const rot = [90, 180, 270, -90][Math.floor(Math.random() * 4)];
                container.style.transform = `rotate(${rot}deg)`;
            }
        }); // <-- THIS tag closes the click event!
    </script>
</body>
</html>
